body::before{
  content:"";position:fixed;inset:0;z-index:-1;
  background:rgba(0,0,0,.30);
}
.wrap{max-width:1050px;margin:0 auto;padding:38px 20px 58px}
header{margin-bottom:24px}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
h1{font-size:clamp(28px,5vw,46px);line-height:1.05;margin:0 0 10px;letter-spacing:-.035em;color:#fff}
.rule{
  margin-top:18px;padding:12px 14px;border-left:3px solid rgba(255,255,255,.75);
  background:var(--glass);border-top:1px solid var(--line);border-right:1px solid var(--line);
  border-bottom:1px solid var(--line);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);
  color:#fff;font-size:13px
}
.podium{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:28px 0 22px}
.card{
  background:rgba(8,12,14,.45);border:1px solid var(--line);border-radius:14px;padding:20px;
  backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);
  box-shadow:0 5px 24px rgba(0,0,0,.22)
}
.card .rank{font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.card .runner{font-size:20px;font-weight:750;margin-top:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#fff}
.card .time{font-size:25px;font-variant-numeric:tabular-nums;font-weight:800;margin-top:6px;letter-spacing:-.02em;color:#fff}
.rank-1{border-top:3px solid var(--gold)} .rank-2{border-top:3px solid var(--silver)} .rank-3{border-top:3px solid var(--bronze)}
input{
  width:min(360px,100%);padding:11px 13px;border:1px solid rgba(255,255,255,.25);
  border-radius:8px;background:rgba(0,0,0,.30);color:#fff;font:inherit;outline:none
}
input::placeholder{color:rgba(255,255,255,.65)}
input:focus{border-color:rgba(255,255,255,.65);box-shadow:0 0 0 3px rgba(255,255,255,.12)}
.table-wrap{
  background:rgba(5,9,10,.43);border:1px solid var(--line);border-radius:14px;overflow:hidden;
  backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);box-shadow:0 8px 30px rgba(0,0,0,.24)
}
table{width:100%;border-collapse:collapse}
th,td{padding:14px 16px;text-align:left;border-bottom:1px solid rgba(255,255,255,.13)}
th{
  font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:rgba(255,255,255,.82);
  background:rgba(255,255,255,.08);cursor:pointer;user-select:none
}
td{font-size:14px;color:#fff}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:rgba(255,255,255,.10)}
.place{width:90px;font-weight:750;color:#fff;vertical-align:middle}
.rank-icon{display:inline-block;vertical-align:middle;object-fit:contain}
.rank-icon.rank-1{width:32px;height:27px;border-top:0}
.rank-icon.rank-2{width:32px;height:27px;border-top:0}
.rank-icon.rank-3{width:32px;height:27px;border-top:0}
.rank-icon.rank-4{width:28px;height:28px;border-top:0}
.runner-cell{font-weight:650}
.time-cell{font-variant-numeric:tabular-nums;font-feature-settings:"tnum";white-space:nowrap;font-weight:700}
.proof{color:#fff;text-decoration:underline;text-decoration-color:rgba(255,255,255,.45);text-underline-offset:2px}
.proof:hover{text-decoration-color:#fff}
footer{margin-top:18px;color:rgba(255,255,255,.72);font-size:12px}
@media(max-width:650px){
  .wrap{padding:30px 14px 45px}
  .podium{grid-template-columns:1fr}
  .card{padding:16px}
  th,td{padding:12px 10px}
  th:nth-child(4),td:nth-child(4){display:none}
  .place{width:55px}
}
</style>
</head>

<div class="wrap">
  <header>
    <div class="eyebrow">Speedrun Leaderboard</div>
    <h1>Luigi's Mansion — Classic Any%</h1>
    <div class="rule">Rules: Complete the game as fast as possible, without the use of mouse skews.</div>
  </header>

  <section class="podium" id="podium"></section>

function parseTime(s){
  let h=0,m=0,sec=0,ms=0;
  const hm=s.match(/(\d+)h/), mm=s.match(/(\d+)m/), sm=s.match(/(\d+)s/), xm=s.match(/(\d+)ms/);
  if(hm) h=+hm[1]; if(mm) m=+mm[1]; if(sm) sec=+sm[1]; if(xm) ms=+xm[1];
  return h*3600+m*60+sec+ms/1000;
}
runs.forEach(r=>r.seconds=parseTime(r.time));

const podium=document.getElementById('podium');
const tbody=document.getElementById('leaderboard');
function renderPodium(){
  podium.innerHTML = runs.slice().sort((a,b)=>a.seconds-b.seconds).slice(0,3).map((r,i)=>`
    <div class="card rank-${i+1}">
      <div class="rank">${['1st','2nd','3rd'][i]}</div>
      <div class="runner">${escapeHtml(r.runner)}</div>
      <div class="time">${escapeHtml(r.time)}</div>
    </div>`).join('');
}
function render(){
  let list=[...runs];
  tbody.innerHTML=list.map(r=>`
    <tr>
      <td class="place">${r.place <= 4
        ? `<img class="rank-icon rank-${r.place}" src="${rankImages[r.place]}" alt="${r.place}${r.place===1?'st':r.place===2?'nd':r.place===3?'rd':'th'} place" title="#${r.place}">`
        : `#${r.place}`}</td>
      <td class="runner-cell">${escapeHtml(r.runner)}</td>
      <td class="time-cell">${escapeHtml(r.time)}</td>
      <td>${r.proof ? `<a class="proof" href="${escapeAttr(r.proof)}" target="_blank" rel="noopener noreferrer">View proof ↗</a>` : '—'}</td>
    </tr>`).join('');
}
function escapeHtml(s){
  return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
}
function escapeAttr(s){
  return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
renderPodium();
render();
